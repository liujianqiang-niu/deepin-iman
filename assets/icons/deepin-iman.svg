<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066cc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#003d80;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00b8d4;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded background -->
  <rect x="16" y="16" width="224" height="224" rx="48" ry="48" fill="url(#bg)"/>

  <!-- Book shape (man manual) -->
  <g transform="translate(48,44)">
    <!-- Book pages -->
    <rect x="0" y="0" width="140" height="160" rx="8" fill="#ffffff" opacity="0.95"/>
    <!-- Book spine shadow -->
    <rect x="0" y="0" width="12" height="160" rx="2" fill="#003d80" opacity="0.3"/>
    <!-- Text lines -->
    <rect x="28" y="24" width="90" height="6" rx="3" fill="#0066cc" opacity="0.6"/>
    <rect x="28" y="42" width="76" height="6" rx="3" fill="#0066cc" opacity="0.5"/>
    <rect x="28" y="60" width="96" height="6" rx="3" fill="#0066cc" opacity="0.5"/>
    <rect x="28" y="78" width="64" height="6" rx="3" fill="#0066cc" opacity="0.4"/>
    <rect x="28" y="96" width="84" height="6" rx="3" fill="#0066cc" opacity="0.4"/>
    <rect x="28" y="114" width="72" height="6" rx="3" fill="#0066cc" opacity="0.4"/>
    <!-- Terminal prompt -->
    <text x="28" y="146" font-family="monospace" font-size="14" fill="#0066cc" opacity="0.7">&gt;_</text>
  </g>

  <!-- AI Spark (4-point star, top-right) -->
  <g transform="translate(178,46)" filter="url(#glow)">
    <path d="M 0,-28 L 8,-8 L 28,0 L 8,8 L 0,28 L -8,8 L -28,0 L -8,-8 Z" fill="url(#spark)"/>
  </g>
</svg>
